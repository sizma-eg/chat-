<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#080808">

<meta
    name="description"
    content="Chat+ — محادثات خاصة وسريعة."
>

<title>Chat+ — Private Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070707;
    --panel:#101010;
    --panel2:#151515;
    --panel3:#1b1b1b;
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --muted:#999;
    --bubble:#202020;
    --mine:#fff;
    --mineText:#080808;
    --danger:#ff4d5e;
}

body{
    font-family:"Cairo",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow:hidden;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}


/* =========================================================
   AUTH
========================================================= */

.auth-screen{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,255,255,.08),
            transparent 35%
        ),
        #070707;
}

.auth-box{
    width:100%;
    max-width:430px;
    background:rgba(17,17,17,.94);
    border:1px solid var(--border);
    border-radius:28px;
    padding:35px;
    box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    font-size:42px;
    font-weight:800;
    letter-spacing:-2px;
    margin-bottom:7px;
}

.logo span{
    color:#999;
}

.auth-subtitle{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-bottom:30px;
}

.auth-form{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.field{
    position:relative;
}

.field input{
    width:100%;
    height:54px;
    padding:0 17px;
    background:#0d0d0d;
    border:1px solid var(--border);
    border-radius:15px;
    color:#fff;
    outline:none;
    transition:.2s;
}

.field input:focus{
    border-color:rgba(255,255,255,.35);
    background:#111;
}

.auth-btn{
    height:54px;
    border-radius:15px;
    background:#fff;
    color:#000;
    font-weight:800;
    font-size:15px;
    margin-top:5px;
    transition:.2s;
}

.auth-btn:hover{
    transform:translateY(-1px);
    opacity:.92;
}

.auth-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.switch-auth{
    text-align:center;
    margin-top:20px;
    color:var(--muted);
    font-size:13px;
}

.switch-auth button{
    background:none;
    color:#fff;
    font-weight:700;
    margin-right:5px;
}

.auth-error{
    background:rgba(255,77,94,.1);
    border:1px solid rgba(255,77,94,.2);
    color:#ff8c97;
    padding:11px 13px;
    border-radius:12px;
    font-size:12px;
    margin-bottom:12px;
}


/* =========================================================
   APP
========================================================= */

.app{
    height:100vh;
    width:100%;
    display:flex;
    background:#080808;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:350px;
    min-width:350px;
    height:100%;
    border-left:1px solid var(--border);
    background:#0d0d0d;
    display:flex;
    flex-direction:column;
}

.sidebar-top{
    padding:22px 20px 15px;
}

.brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.brand{
    font-size:25px;
    font-weight:800;
    letter-spacing:-1px;
}

.brand span{
    color:#777;
}

.profile-mini{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#202020;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    border:1px solid var(--border);
    cursor:pointer;
}

.search-box{
    position:relative;
}

.search-box input{
    width:100%;
    height:46px;
    background:#171717;
    border:1px solid var(--border);
    border-radius:14px;
    color:#fff;
    padding:0 43px 0 14px;
    outline:none;
}

.search-icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
}

.tabs{
    display:flex;
    padding:12px 20px 5px;
    gap:7px;
}

.tab{
    flex:1;
    height:40px;
    border-radius:11px;
    background:transparent;
    color:#777;
    font-weight:700;
}

.tab.active{
    background:#1b1b1b;
    color:#fff;
}

.people-list{
    flex:1;
    overflow-y:auto;
    padding:8px 10px 20px;
}

.people-list::-webkit-scrollbar,
.messages::-webkit-scrollbar{
    width:4px;
}

.people-list::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb{
    background:#2b2b2b;
    border-radius:20px;
}

.person{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-radius:15px;
    cursor:pointer;
    transition:.15s;
}

.person:hover{
    background:#151515;
}

.person.active{
    background:#1b1b1b;
}

.avatar{
    width:46px;
    height:46px;
    min-width:46px;
    border-radius:50%;
    background:linear-gradient(145deg,#292929,#111);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    position:relative;
}

.online-dot{
    position:absolute;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#55e68a;
    border:2px solid #0d0d0d;
    bottom:0;
    left:0;
}

.person-info{
    min-width:0;
    flex:1;
}

.person-name{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.person-username{
    color:#777;
    font-size:11px;
    direction:ltr;
    text-align:right;
}

.empty{
    text-align:center;
    color:#666;
    font-size:13px;
    padding:40px 20px;
}


/* =========================================================
   CHAT
========================================================= */

.chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    position:relative;
}

.chat-header{
    height:74px;
    min-height:74px;
    padding:0 22px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:13px;
    background:rgba(10,10,10,.9);
}

.back-btn{
    display:none;
    width:40px;
    height:40px;
    border-radius:12px;
    background:#181818;
    color:#fff;
    font-size:20px;
}

.header-avatar{
    width:42px;
    height:42px;
    min-width:42px;
}

.header-info{
    flex:1;
    min-width:0;
}

.header-name{
    font-size:14px;
    font-weight:800;
}

.header-status{
    font-size:11px;
    color:#777;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#171717;
    color:#fff;
    border:1px solid var(--border);
    font-size:17px;
}


/* =========================================================
   MESSAGES
========================================================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:25px clamp(15px,5vw,80px);
    display:flex;
    flex-direction:column;
    gap:7px;
}

.start-chat{
    margin:auto;
    text-align:center;
    color:#555;
}

.start-chat .big{
    font-size:50px;
    margin-bottom:10px;
}

.message-row{
    display:flex;
    width:100%;
}

.message-row.mine{
    justify-content:flex-start;
}

.message-row.theirs{
    justify-content:flex-end;
}

.message{
    max-width:min(70%,600px);
    position:relative;
}

.bubble{
    padding:10px 14px;
    border-radius:17px;
    background:var(--bubble);
    color:#fff;
    font-size:14px;
    line-height:1.7;
    word-break:break-word;
    white-space:pre-wrap;
}

.mine .bubble{
    background:var(--mine);
    color:var(--mineText);
    border-bottom-right-radius:5px;
}

.theirs .bubble{
    border-bottom-left-radius:5px;
}

.message-meta{
    font-size:9px;
    color:#666;
    margin-top:3px;
    padding:0 5px;
}

.mine .message-meta{
    text-align:right;
}

.edited{
    color:#777;
    font-size:9px;
    margin-right:4px;
}

.reply-preview{
    border-right:3px solid #888;
    background:rgba(255,255,255,.06);
    padding:5px 8px;
    border-radius:8px;
    font-size:11px;
    color:#aaa;
    margin-bottom:7px;
}

.mine .reply-preview{
    border-right-color:#777;
    background:rgba(0,0,0,.08);
    color:#555;
}

.message-menu{
    position:absolute;
    top:-40px;
    right:0;
    display:none;
    background:#202020;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    z-index:5;
}

.message:hover .message-menu{
    display:flex;
}

.message-menu button{
    background:none;
    color:#fff;
    padding:7px 9px;
    font-size:11px;
}

.message-menu button:hover{
    background:#2a2a2a;
}


/* =========================================================
   COMPOSER
========================================================= */

.composer{
    padding:13px 18px 18px;
    border-top:1px solid var(--border);
    background:#0b0b0b;
}

.reply-bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    background:#161616;
    border-radius:12px;
    margin-bottom:8px;
    font-size:11px;
    color:#aaa;
}

.reply-bar-text{
    flex:1;
}

.reply-close{
    background:none;
    color:#fff;
    font-size:16px;
}

.composer-inner{
    display:flex;
    align-items:flex-end;
    gap:8px;
}

.textarea-wrap{
    flex:1;
    background:#161616;
    border:1px solid var(--border);
    border-radius:17px;
    display:flex;
    align-items:flex-end;
    padding:7px 8px;
}

#messageInput{
    width:100%;
    min-height:42px;
    max-height:130px;
    resize:none;
    background:none;
    border:0;
    outline:0;
    color:#fff;
    padding:9px 8px;
    font-size:14px;
}

#messageInput::placeholder{
    color:#666;
}

.emoji-btn,
.send-btn{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:13px;
}

.emoji-btn{
    background:#1b1b1b;
    color:#fff;
    font-size:19px;
}

.send-btn{
    background:#fff;
    color:#000;
    font-size:18px;
    font-weight:800;
}

.send-btn:disabled{
    opacity:.3;
    cursor:not-allowed;
}


/* =========================================================
   VOICE CALL
========================================================= */

.voice-call-overlay{
    position:absolute;
    inset:0;
    z-index:80;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(12px);
}

.voice-call-card{
    width:min(360px,100%);
    padding:34px 24px 28px;
    border:1px solid #2b2b2b;
    border-radius:28px;
    background:#111;
    text-align:center;
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.call-avatar{
    width:82px;
    height:82px;
    margin:0 auto 16px;
    font-size:28px;
}

.call-name{
    font-size:19px;
    font-weight:800;
}

.call-status{
    margin-top:7px;
    color:#999;
    font-size:12px;
}

.call-timer{
    margin-top:9px;
    color:#ddd;
    font-size:13px;
    min-height:18px;
}

.call-actions{
    display:flex;
    justify-content:center;
    gap:24px;
    margin-top:25px;
}

.call-action{
    width:58px;
    height:58px;
    border-radius:50%;
    color:#fff;
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.call-action.accept{ background:#1f9d55; }
.call-action.reject{ background:#c92f3d; }
.call-action.mute{ background:#242424; border:1px solid #333; }

.typing-indicator{
    align-self:flex-end;
    color:#777;
    font-size:11px;
    padding:3px 8px 8px;
    min-height:20px;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-panel{
    position:absolute;
    top:0;
    left:0;
    width:340px;
    height:100%;
    background:#111;
    border-right:1px solid var(--border);
    z-index:30;
    transform:translateX(-105%);
    transition:.25s ease;
    box-shadow:20px 0 80px rgba(0,0,0,.4);
}

.profile-panel.open{
    transform:translateX(0);
}

.profile-head{
    height:74px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 18px;
}

.profile-head button{
    background:none;
    color:#fff;
    font-size:20px;
}

.profile-content{
    padding:30px 20px;
    text-align:center;
}

.profile-avatar{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(145deg,#303030,#111);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:800;
    border:1px solid var(--border);
}

.profile-name{
    font-size:20px;
    font-weight:800;
    margin-top:15px;
}

.profile-username{
    color:#666;
    font-size:12px;
    direction:ltr;
}

.profile-actions{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.profile-action{
    width:100%;
    min-height:48px;
    border-radius:13px;
    background:#1a1a1a;
    color:#fff;
    text-align:right;
    padding:0 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:1px solid var(--border);
}

.profile-action:hover{
    background:#202020;
}

.profile-action:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.profile-action.danger{
    color:#ff6975;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translate(-50%,20px);
    background:#fff;
    color:#000;
    padding:11px 17px;
    border-radius:12px;
    font-size:12px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* =========================================================
   EMOJI
========================================================= */

.emoji-panel{
    position:absolute;
    bottom:82px;
    right:20px;
    width:270px;
    background:#171717;
    border:1px solid var(--border);
    border-radius:17px;
    padding:12px;
    display:none;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
    z-index:20;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.emoji-panel.open{
    display:grid;
}

.emoji{
    background:none;
    font-size:21px;
    padding:6px;
    border-radius:8px;
}

.emoji:hover{
    background:#252525;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    color:#555;
}

.loader{
    width:25px;
    height:25px;
    border:2px solid #333;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   RESPONSIVE / MOBILE
========================================================= */

@media (max-width: 800px){

    html,
    body{
        width:100%;
        height:100%;
        min-height:100%;
        overflow:hidden;
    }

    body{
        min-height:100dvh;
    }

    .app{
        position:relative;
        width:100%;
        height:100dvh;
        min-height:100dvh;
        overflow:hidden;
        display:block;
    }

    .sidebar{
        position:absolute;
        inset:0;
        width:100%;
        min-width:0;
        height:100%;
        z-index:1;
        border-left:0;
        overflow:hidden;
    }

    .sidebar-top{
        padding:16px 14px 10px;
    }

    .brand-row{
        margin-bottom:13px;
    }

    .brand{
        font-size:23px;
    }

    .search-box input{
        height:45px;
        padding-right:42px;
    }

    .tabs{
        padding:8px 14px 5px;
    }

    .people-list{
        min-height:0;
        overflow-y:auto;
        -webkit-overflow-scrolling:touch;
        padding:6px 8px 16px;
    }

    .person{
        padding:11px 10px;
    }

    .chat{
        position:absolute;
        top:0;
        right:0;
        bottom:0;
        left:0;
        width:100%;
        height:100%;
        min-width:0;
        min-height:0;
        background:#080808;
        transform:translateX(100%);
        transition:transform .25s ease;
        z-index:20;
        overflow:hidden;
        display:flex;
    }

    .app.chat-open .chat{
        transform:translateX(0);
    }

    .chat-header{
        flex:0 0 64px;
        height:64px;
        min-height:64px;
        padding:0 10px;
        gap:9px;
    }

    .back-btn{
        display:flex;
        align-items:center;
        justify-content:center;
        flex:0 0 40px;
        width:40px;
        height:40px;
        font-size:25px;
    }

    .header-avatar{
        width:40px;
        height:40px;
        min-width:40px;
    }

    .header-name{
        font-size:13px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .header-status{
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .header-actions{
        flex:0 0 auto;
    }

    .icon-btn{
        width:38px;
        height:38px;
    }

    .messages{
        flex:1 1 auto;
        min-height:0;
        width:100%;
        overflow-y:auto;
        overflow-x:hidden;
        padding:14px 10px;
        -webkit-overflow-scrolling:touch;
    }

    .message{
        max-width:86%;
        min-width:0;
    }

    .bubble{
        font-size:13px;
        line-height:1.65;
        padding:9px 12px;
        max-width:100%;
    }

    .message-menu{
        top:-38px;
        right:auto;
        left:0;
    }

    .composer{
        flex:0 0 auto;
        width:100%;
        padding:6px 8px calc(6px + env(safe-area-inset-bottom));
        position:relative;
    }

    .composer-inner{
        width:100%;
        gap:6px;
    }

    .textarea-wrap{
        min-width:0;
        border-radius:15px;
        padding:5px 6px;
    }

    #messageInput{
        min-height:40px;
        max-height:110px;
        font-size:14px;
        padding:8px 6px;
    }

    .emoji-btn,
    .send-btn{
        width:42px;
        height:42px;
        min-width:42px;
        flex:0 0 42px;
    }

    .emoji-panel{
        right:8px;
        bottom:70px;
        width:min(270px,calc(100vw - 16px));
        max-height:45vh;
        overflow-y:auto;
    }

    .profile-panel{
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        max-width:none;
    }

    .profile-content{
        padding:25px 16px;
    }

    .auth-screen{
        min-height:100dvh;
        height:100dvh;
        padding:14px;
        overflow-y:auto;
    }

    .auth-box{
        width:100%;
        max-width:430px;
        padding:26px 18px;
        border-radius:22px;
    }

    .logo{
        font-size:36px;
    }

    .auth-subtitle{
        margin-bottom:23px;
    }
}

@media (max-width: 480px){

    .sidebar-top{
        padding:13px 10px 8px;
    }

    .profile-mini{
        width:38px;
        height:38px;
    }

    .brand{
        font-size:21px;
    }

    .tabs{
        padding-left:10px;
        padding-right:10px;
    }

    .tab{
        height:38px;
        font-size:12px;
    }

    .person{
        gap:9px;
        padding:10px 8px;
    }

    .avatar{
        width:43px;

/* =========================================================

function showToast(text){

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {
            toast.classList.remove("show");

}


function showAuthError(text){

    authError.textContent = text;

    authError.classList.remove("hidden");
}


function clearAuthError(){

    authError.textContent = "";

    authError.classList.add("hidden");
}


function getInitial(name){

    if(!name)
        return "?";

    return (
        [...name.trim()][0]
        ?.toUpperCase()
        || "?"
    );
}


function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


function formatTime(date){

    return new Date(date)
        .toLocaleTimeString(
            "ar-EG",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}


function formatLastSeen(date){

    if(!date)
        return "غير متصل";

    const d =
        new Date(date);

    const diff =
        Date.now() -
        d.getTime();

    if(diff < 60000)
        return "نشط الآن";

    if(diff < 3600000){

        return `منذ ${
            Math.floor(diff / 60000)
        } دقيقة`;
    }

    return `آخر ظهور ${
        d.toLocaleTimeString(
            "ar-EG",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )
    }`;
}


/* =========================================================
   USERNAME NORMALIZATION
   IMPORTANT:
   النقطة مسموحة الآن في username
   مثال:
   crush.time -> crush.time
========================================================= */

function normalizeUsername(username){

    return username
        .trim()
        .toLowerCase()
        .replace(/\s+/g,"_")
        .replace(
            /[^a-z0-9._\u0600-\u06ff]/g,
            ""
        );
}


/*
 * Supabase Auth يحتاج email أو phone.
 * التسجيل الجديد يستخدم email داخلي مخفي.
 */

function getInternalEmail(username){

    return (
        normalizeUsername(username) +
        "@chatplus.local"
    );
}

        }
    }
);


/* =========================================================
   LOGIN
   USERNAME + PASSWORD
   COMPATIBLE WITH OLD ACCOUNTS
========================================================= */

loginForm.addEventListener(
    "submit",
    async e => {

        e.preventDefault();

        clearAuthError();


        const username =
            normalizeUsername(
                document
                    .getElementById("loginUsername")
                    .value
            );


        const password =
            document
                .getElementById("loginPassword")
                .value;


        if(
            username.length < 3 ||
            !password
        ){

            showAuthError(
                "اكتب اسم المستخدم وكلمة المرور."
            );

            return;
        }


        const submitButton =
            loginForm.querySelector(
                "button[type='submit']"
            );


        submitButton.disabled = true;

        submitButton.textContent =
            "جاري تسجيل الدخول...";


        try{

            const {
                data: loginEmail,
                error: lookupError
            } =
                await supabaseClient.rpc(
                    "get_login_email",
                    {
                        p_username:
                            username
                    }
                );


            if(
                lookupError ||
                !loginEmail
            ){

                console.error(
                    "Username lookup error:",
                    lookupError
                );


                showAuthError(
                    "اسم المستخدم أو كلمة المرور غير صحيحة."
                );

                return;
            }


            const {
                error: loginError
            } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email:
                            loginEmail,

                        password

                    });


            if(loginError){

                console.error(
                    "Login error:",
                    loginError
                );


                showAuthError(
                    "اسم المستخدم أو كلمة المرور غير صحيحة."
                );

                return;
            }


            showToast(
                "تم تسجيل الدخول"
            );


        }catch(error){

            console.error(
                "Unexpected login error:",
                error
            );


            showAuthError(
                "حصل خطأ غير متوقع."
            );

        }finally{

            submitButton.disabled =
                false;

            submitButton.textContent =
                "تسجيل الدخول";
        }

    }
);

            showAuthError(

            console.error(error);

            );

            submitButton.disabled =
                false;

            submitButton.textContent =
                "إنشاء الحساب";

/* =========================================================
   RENDER PEOPLE
========================================================= */

function renderPeople(){

    let list =
        [...allUsers];


    const term =
        searchTerm
            .trim()
            .toLowerCase();


    if(term){

        list =
            list.filter(
                user =>

                    (
                        user.display_name ||
                        ""
                    )
                    .toLowerCase()
                    .includes(term)

                    ||

                    (
                        user.username ||
                        ""
                    )
                    .toLowerCase()
                    .includes(term)
            );
    }


    if(activeTab === "chats"){

        const userIds =
            new Set();


        allMessages.forEach(
            message => {

                if(
                    message.sender_id ===
                    currentUser.id
                ){

                    userIds.add(
                        message.receiver_id
                    );
                }


                if(
                    message.receiver_id ===
                    currentUser.id
                ){

                    userIds.add(
                        message.sender_id
                    );
                }

            }
        );


        list =
            list.filter(
                user =>
                    userIds.has(user.id)
            );
    }


    if(!list.length){

        peopleList.innerHTML =
            `
            <div class="empty">
                ${
                    activeTab === "chats"
                        ? "مفيش محادثات لسه."
                        : "مفيش مستخدمين مطابقين."
                }
            </div>
            `;

        return;
    }


    peopleList.innerHTML =
        list
            .map(user => {

                const active =
                    selectedUser?.id ===
                    user.id
                        ? "active"
                        : "";


                return `
                    <div
                        class="person ${active}"
                        data-user-id="${user.id}"
                    >

                        <div class="avatar">

                            ${escapeHTML(
                                getInitial(
                                    user.display_name
                                )
                            )}

                            ${
                                user.online
                                    ? `<span class="online-dot"></span>`
                                    : ""
                            }

                        </div>


                        <div class="person-info">

                            <div class="person-name">
                                ${escapeHTML(
                                    user.display_name
                                )}
                            </div>

                            <div class="person-username">
                                @${escapeHTML(
                                    user.username
                                )}
                            </div>

                        </div>

                    </div>
                `;
            })
            .join("");


    document
        .querySelectorAll(".person")
        .forEach(el => {

            el.addEventListener(
                "click",
                () => {

                    const user =
                        allUsers.find(
                            u =>
                                u.id ===
                                el.dataset.userId
                        );


                    if(user)
                        openChat(user);
                }
            );

        });

/* =========================================================
   SINGLE MESSAGE
========================================================= */

function renderMessage(message){

    const mine =
        message.sender_id ===
        currentUser.id;


    const rowClass =
        mine
            ? "mine"
            : "theirs";


    let replyHTML = "";


    if(message.reply_to){

        const original =
            allMessages.find(
                m =>
                    m.id ===
                    message.reply_to
            );


        if(original){

            replyHTML =
                `
                <div class="reply-preview">

                    ${escapeHTML(
                        original.text.slice(
                            0,
                            100
                        )
                    )}

                </div>
                `;
        }
    }


    let menu =
        `
        <div class="message-menu">

            <button
                data-action="reply"
                data-id="${message.id}"
            >
                رد
            </button>
        `;


    if(mine){

        menu +=
            `
            <button
                data-action="edit"
                data-id="${message.id}"
            >
                تعديل
            </button>

            <button
                data-action="delete"
                data-id="${message.id}"
            >
                حذف
            </button>
            `;
    }


    menu +=
        `
        </div>
        `;


    return `
        <div class="message-row ${rowClass}">

            <div class="message">

                ${menu}

                <div class="bubble">

                    ${replyHTML}

                    ${escapeHTML(
                        message.text
                    )}

                </div>

                <div class="message-meta">

                    ${formatTime(
                        message.created_at
                    )}

                    ${
                        message.edited_at
                            ? `
                                <span class="edited">
                                    تم التعديل
                                </span>
                              `
                            : ""
                    }

                    ${
                        mine
                            ? (
                                message.read_at
                                    ? " ✓✓"
                                    : " ✓"
                            )
                            : ""
                    }

                </div>

            </div>

        </div>
    `;
}

async function sendMessage(){

    if(
        !currentUser ||
        !selectedUser
    )
        return;


    const text =
        messageInput.value.trim();


    if(!text)
        return;


    /* EDIT */

    if(editingMessage){

        const {
            error
        } =
            await supabaseClient
                .from("messages")
                .update({

                    text,

                    edited_at:
                        new Date()
                            .toISOString()

                })
                .eq(
                    "id",
                    editingMessage.id
                )
                .eq(
                    "sender_id",
                    currentUser.id
                );


        if(error){

            console.error(error);

            showToast(
                "فشل تعديل الرسالة"
            );

            return;
        }


        editingMessage =
            null;


        messageInput.value =
            "";

        messageInput.placeholder =
            "اكتب رسالة...";

        sendBtn.textContent =
            "➤";

        autoResize();

        return;
    }


    /* NEW MESSAGE */

    const payload = {

        sender_id:
            currentUser.id,

        receiver_id:
            selectedUser.id,

        text,

        reply_to:
            replyingTo
                ? replyingTo.id
                : null

    };


    const {
        error
    } =
        await supabaseClient
            .from("messages")
            .insert(payload);


    if(error){

        console.error(error);

        showToast(
            "فشل إرسال الرسالة"
        );

        return;
    }


    messageInput.value =
        "";

    clearReply();

    autoResize();

    scrollMessages();
}

function getAvatarLetter(profile){
    return (profile?.name || profile?.username || "?").charAt(0).toUpperCase();
}

function setCallPerson(profile){
    callName.textContent = profile?.name || profile?.username || "مكالمة صوتية";
    callAvatar.textContent = getAvatarLetter(profile);
}

function showTyping(text){
    typingIndicator.textContent = text;
    typingIndicator.classList.remove("hidden");
    clearTimeout(remoteTypingTimer);
    remoteTypingTimer = setTimeout(() => {
        typingIndicator.classList.add("hidden");
    }, 2200);

async function getControlChannel(userId){
    if(!userId || !currentUser) return null;

    if(userId === currentUser.id && realtimeControlChannel)
        return realtimeControlChannel;

    if(controlChannels.has(userId))
        return controlChannels.get(userId);

    const channel = supabaseClient.channel(`chatplus-control-${userId}`);
    controlChannels.set(userId, channel);

    await new Promise(resolve => {
        let settled = false;
        const finish = () => {
            if(settled) return;
            settled = true;
            resolve();
        };

        channel.subscribe(status => {
            if(status === "SUBSCRIBED" || status === "CHANNEL_ERROR" || status === "TIMED_OUT")
                finish();
        });

        setTimeout(finish, 4000);
    });

    return channel;
}

async function sendSignal(userId, event, payload){
    const channel = await getControlChannel(userId);
    if(!channel) return;
    await channel.send({type:"broadcast", event, payload});
}

function sendTypingState(isTyping){
    if(!selectedUser || !currentUser) return;
    sendSignal(selectedUser.id, "typing", {
        kind: isTyping ? "start" : "stop",
        from: currentUser.id,
        to: selectedUser.id,
        name: currentProfile?.name || currentProfile?.username || "المستخدم"
    }).catch(()=>{});
}

function resetTypingState(){
    clearTimeout(typingStopTimer);
    sendTypingState(false);
}

function formatCallTime(ms){
    const total = Math.floor(ms / 1000);
    const m = String(Math.floor(total / 60)).padStart(2,"0");
    const sec = String(total % 60).padStart(2,"0");
    return `${m}:${sec}`;
}

function startCallTimer(){
    callStartedAt = Date.now();
    clearInterval(callTimerInterval);
    callTimer.textContent = "00:00";
    callTimerInterval = setInterval(() => {
        callTimer.textContent = formatCallTime(Date.now() - callStartedAt);
    }, 1000);
}

function stopCallTimer(){
    clearInterval(callTimerInterval);
    callTimerInterval = null;
    callStartedAt = null;
    callTimer.textContent = "00:00";
}

function showCallOverlay(profile, status, incoming=false){
    setCallPerson(profile);
    callStatus.textContent = status;
    voiceCallOverlay.classList.remove("hidden");
    incomingCallActions.classList.toggle("hidden", !incoming);
    activeCallActions.classList.toggle("hidden", incoming);
}

function hideCallOverlay(){
    voiceCallOverlay.classList.add("hidden");
    incomingCallActions.classList.add("hidden");
    activeCallActions.classList.add("hidden");
    stopCallTimer();
}

async function createPeerConnection(targetId){
    const pc = new RTCPeerConnection({
        iceServers:[
            {urls:"stun:stun.l.google.com:19302"},
            {urls:"stun:stun1.l.google.com:19302"}
        ]
    });

    pc.onicecandidate = event => {
        if(event.candidate){
            sendSignal(targetId, "call-ice", {
                from:currentUser.id,
                to:targetId,
                candidate:event.candidate
            }).catch(()=>{});
        }
    };

    pc.ontrack = event => {
        if(event.streams?.[0]){
            remoteAudio.srcObject = event.streams[0];
            remoteAudio.play().catch(()=>{});
        }
    };

    pc.onconnectionstatechange = () => {
        if(["failed","disconnected","closed"].includes(pc.connectionState)){
            endVoiceCall(false);
        }
    };

    return pc;
}

async function getMicrophone(){
    return navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
        video:false
    });
}

async function startVoiceCall(){
    if(!selectedUser || !currentUser || peerConnection) return;

    if(!navigator.mediaDevices?.getUserMedia){
        showToast("المتصفح لا يدعم المكالمات الصوتية");
        return;
    }

    try{
        activeCallUser = selectedUser;
        callRole = "caller";
        pendingIceCandidates = [];
        localStream = await getMicrophone();
        peerConnection = await createPeerConnection(selectedUser.id);

        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        showCallOverlay(selectedUser, "جاري الاتصال...", false);

        await sendSignal(selectedUser.id, "call-offer", {
            from:currentUser.id,
            to:selectedUser.id,
            name:currentProfile?.name || currentProfile?.username || "مستخدم",
            username:currentProfile?.username || "",
            offer
        });
    }catch(error){
        console.error("Start call error:", error);
        showToast("تعذر بدء المكالمة");
        await cleanupVoiceCall(false);
    }
}

async function acceptVoiceCall(){
    if(!incomingOffer || !currentUser) return;

    try{
        callRole = "receiver";
        activeCallUser = incomingOffer.profile;
        pendingIceCandidates = [];
        localStream = await getMicrophone();
        peerConnection = await createPeerConnection(incomingOffer.from);

        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer.offer));

        for(const candidate of pendingIceCandidates){
            await peerConnection.addIceCandidate(candidate).catch(()=>{});
        }
        pendingIceCandidates = [];

        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        showCallOverlay(activeCallUser, "متصل", false);
        startCallTimer();

        await sendSignal(incomingOffer.from, "call-answer", {
            from:currentUser.id,
            to:incomingOffer.from,
            answer
        });

        incomingOffer = null;
    }catch(error){
        console.error("Accept call error:", error);
        showToast("تعذر قبول المكالمة");
        await endVoiceCall(true);
    }
}

async function rejectVoiceCall(){
    if(incomingOffer && realtimeControlChannel){
        await sendSignal(incomingOffer.from, "call-reject", {from:currentUser.id,to:incomingOffer.from}).catch(()=>{});
    }
    incomingOffer = null;
    await cleanupVoiceCall(false);
}

async function cleanupVoiceCall(notify=true){
    if(notify && activeCallUser && realtimeControlChannel){
        await sendSignal(activeCallUser.id, "call-end", {from:currentUser?.id,to:activeCallUser.id}).catch(()=>{});
    }

    if(peerConnection){
        peerConnection.ontrack = null;
        peerConnection.onicecandidate = null;
        peerConnection.close();
    }

    peerConnection = null;

    if(localStream){
        localStream.getTracks().forEach(track => track.stop());
    }

    localStream = null;
    pendingIceCandidates = [];
    activeCallUser = null;
    incomingOffer = null;
    callRole = null;
    isCallMuted = false;
    remoteAudio.srcObject = null;
    muteCallBtn.textContent = "🎙️";
    hideCallOverlay();
}

async function endVoiceCall(notify=true){
    await cleanupVoiceCall(notify);
}

async function setupRealtimeControl(){
    if(realtimeControlChannel){
        await supabaseClient.removeChannel(realtimeControlChannel);
    }

    realtimeControlChannel = supabaseClient
        .channel(`chatplus-control-${currentUser.id}`)
        .on("broadcast", {event:"typing"}, ({payload}) => {
            if(payload?.to !== currentUser.id) return;
            if(payload.from !== selectedUser?.id) return;
            if(payload.kind === "start"){
                showTyping(`${payload.name || "المستخدم"} يكتب...`);
            }else{
                clearTimeout(remoteTypingTimer);
                typingIndicator.classList.add("hidden");
            }
        })
        .on("broadcast", {event:"call-offer"}, async ({payload}) => {
            if(payload?.to !== currentUser.id || peerConnection || incomingOffer) return;

            const profile = allUsers.find(u => u.id === payload.from) || {
                id:payload.from,
                name:payload.name,
                username:payload.username
            };

            incomingOffer = {...payload, profile};
            showCallOverlay(profile, "مكالمة صوتية واردة", true);
        })
        .on("broadcast", {event:"call-answer"}, async ({payload}) => {
            if(payload?.to !== currentUser.id || !peerConnection || callRole !== "caller") return;
            try{
                await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.answer));
                startCallTimer();
                callStatus.textContent = "متصل";
            }catch(error){
                console.error("Answer error:", error);
                await endVoiceCall(true);
            }
        })
        .on("broadcast", {event:"call-ice"}, async ({payload}) => {
            if(payload?.to !== currentUser.id || !payload.candidate) return;
            const candidate = new RTCIceCandidate(payload.candidate);
            if(peerConnection?.remoteDescription){
                await peerConnection.addIceCandidate(candidate).catch(()=>{});
            }else{
                pendingIceCandidates.push(candidate);
            }
        })
        .on("broadcast", {event:"call-reject"}, async ({payload}) => {
            if(payload?.to !== currentUser.id) return;
            showToast("تم رفض المكالمة");
            await cleanupVoiceCall(false);
        })
        .on("broadcast", {event:"call-end"}, async ({payload}) => {
            if(payload?.to !== currentUser.id) return;
            await cleanupVoiceCall(false);
            showToast("انتهت المكالمة");
        })
        .subscribe();
}

/* =========================================================
   REALTIME
========================================================= */

function setupRealtime(){

    if(messagesChannel){

        supabaseClient.removeChannel(
            messagesChannel
        );
    }


    if(profilesChannel){

        supabaseClient.removeChannel(
            profilesChannel
        );
    }


    messagesChannel =
        supabaseClient
            .channel(
                "chatplus-messages"
            )
            .on(
                "postgres_changes",
                {
                    event:"*",
                    schema:"public",
                    table:"messages"
                },
                async payload => {

                    if(!currentUser)
                        return;


                    const message =
                        payload.new ||
                        payload.old;


                    if(!message)
                        return;


                    const related =
                        message.sender_id ===
                            currentUser.id
                        ||
                        message.receiver_id ===
                            currentUser.id;


                    if(!related)
                        return;


                    if(selectedUser){

                        const conversation =

                            (
                                message.sender_id ===
                                currentUser.id &&

                                message.receiver_id ===
                                selectedUser.id
                            )

                            ||

                            (
                                message.sender_id ===
                                selectedUser.id &&

                                message.receiver_id ===
                                currentUser.id
                            );


                        if(conversation){

                            await loadConversation();


                            if(
                                message.receiver_id ===
                                currentUser.id
                            ){

                                await markMessagesRead();
                            }
                        }
                    }


                    await loadRecentMessages();

                    renderPeople();

                }
            )
            .subscribe();


    profilesChannel =
        supabaseClient
            .channel(
                "chatplus-profiles"
            )
            .on(
                "postgres_changes",
                {
                    event:"*",
                    schema:"public",
                    table:"profiles"
                },
                async payload => {

                    await loadUsers();


                    if(
                        selectedUser &&
                        payload.new?.id ===
                        selectedUser.id
                    ){

                        selectedUser =
                            payload.new;

                        updateHeaderStatus();
                    }

                }
            )
            .subscribe();

    setupRealtimeControl();
}


/* =========================================================
   RECENT MESSAGES
========================================================= */

async function loadRecentMessages(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .select("*")
            .or(
                `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            )
            .limit(500);


    if(!error)
        allMessages =
            data || [];
}

        const firstConfirm =
            confirm(
                "⚠️ هل أنت متأكد من حذف حسابك نهائيًا؟\n\n" +
                "سيتم حذف الحساب والرسائل والبيانات المرتبطة به، " +
                "ولا يمكن التراجع عن العملية."
            );


        if(!firstConfirm)
            return;


        const secondConfirm =
            prompt(
                "للتأكيد النهائي، اكتب بالضبط: حذف الحساب"
            );


        if(
            secondConfirm !==
            "حذف الحساب"
        ){

            showToast(
                "تم إلغاء حذف الحساب."
            );

            return;
        }


        deleteAccountBtn.disabled =

        deleteAccountBtn.innerHTML =
            `
            <span>
                جاري حذف الحساب...
            </span>

            <span>
                ⏳
            </span>
            `;


        try{

            const {
                error
            } =
                await supabaseClient.rpc(
                    "delete_my_account"
                );


            if(error){

                console.error(
                    "Delete account error:",
                    error
                );


                showToast(
                    "فشل حذف الحساب. حاول مرة أخرى."
                );


                return;
            }

                await supabaseClient
                    .removeChannel(
                        messagesChannel

            }


            if(profilesChannel){

                await supabaseClient
                    .removeChannel(
                        profilesChannel

            }

            currentProfile = null;
            selectedUser = null;
            allUsers = [];
            allMessages = [];

                .signOut();


            app.classList.add("hidden");

                "hidden"

            signupForm.reset();

            showToast(

        }catch(error){

            console.error(error);

                "حصل خطأ أثناء حذف الحساب."
            );

        }finally{

/* =========================================================
   PUSH
========================================================= */

function urlBase64ToUint8Array(
    base64String
){

    const padding =
        "=".repeat(
            (
                4 -
                base64String.length % 4
            ) % 4
        );


    const base64 =
        (
            base64String +
            padding
        )
        .replace(/-/g,"+")
        .replace(/_/g,"/");


    const rawData =
        window.atob(base64);


    return Uint8Array.from(
        [...rawData]
            .map(
                char =>
                    char.charCodeAt(0)
            )
    );
}


/* =========================================================
   SERVICE WORKER
========================================================= */

async function registerPushServiceWorker(){

    if(
        !("serviceWorker" in navigator)
    ){

        throw new Error(
            "المتصفح لا يدعم Service Worker."
        );
    }


    return await navigator.serviceWorker
        .register(
            "/chat-/sw.js",
            {
                scope:"/chat-/"
            }
        );
}


/* =========================================================
   NOTIFICATION UI
========================================================= */

async function updateNotificationButton(){

    if(
        !("Notification" in window)
    ){

        notificationStatus.textContent =
            "غير مدعوم";

        return;
    }


    if(
        Notification.permission ===
        "granted"
    ){

        notificationStatus.textContent =
            "مفعّلة";

    }else if(
        Notification.permission ===
        "denied"
    ){

        notificationStatus.textContent =
            "مرفوضة";

    }else{

        notificationStatus.textContent =
            "تفعيل";
    }
}


/* =========================================================
   SAVE PUSH
========================================================= */

async function savePushSubscription(
    subscription
){

    if(!currentUser)
        return false;


    const json =
        subscription.toJSON();


    const endpoint =
        json.endpoint;

    const p256dh =
        json.keys?.p256dh;

    const auth =
        json.keys?.auth;


    if(
        !endpoint ||
        !p256dh ||
        !auth
    )
        return false;


    const {
        error
    } =
        await supabaseClient
            .from("push_subscriptions")
            .upsert(
                {
                    user_id:
                        currentUser.id,

                    endpoint,

                    p256dh,

                    auth,

                    updated_at:
                        new Date()
                            .toISOString()
                },
                {
                    onConflict:
                        "user_id,endpoint"
                }
            );


    if(error){

        console.error(
            "Push subscription error:",
            error
        );

        return false;
    }


    return true;
}


/* =========================================================
   ENABLE PUSH
========================================================= */

async function enablePushNotifications(){

    try{

        if(
            !("Notification" in window)
        ){

            showToast(
                "المتصفح لا يدعم الإشعارات."
            );

            return;
        }


        const permission =
            await Notification
                .requestPermission();


        if(
            permission !==
            "granted"
        ){

            showToast(
                "لم يتم السماح بالإشعارات."
            );


            await updateNotificationButton();

            return;
        }


        const registration =
            await registerPushServiceWorker();


        let subscription =
            await registration
                .pushManager
                .getSubscription();


        if(!subscription){

            subscription =
                await registration
                    .pushManager
                    .subscribe({

                        userVisibleOnly:
                            true,

                        applicationServerKey:
                            urlBase64ToUint8Array(
                                VAPID_PUBLIC_KEY
                            )

                    });
        }


        const saved =
            await savePushSubscription(
                subscription
            );


        if(saved){

            showToast(
                "تم تفعيل إشعارات الرسائل 🔔"
            );

            notificationStatus.textContent =
                "مفعّلة";

        }else{

            showToast(
                "تم التفعيل لكن تعذر حفظ الاشتراك."
            );
        }


        await updateNotificationButton();


    }catch(error){

        console.error(error);

        showToast(
            error.message ||
            "حصل خطأ أثناء تفعيل الإشعارات."
        );
    }
}


/* =========================================================
   CHECK PUSH
========================================================= */

async function checkPushSubscription(){

    try{

        if(
            !("serviceWorker" in navigator)
        )
            return;


        if(
            !("Notification" in window)
        )
            return;


        await updateNotificationButton();


        if(
            Notification.permission !==
            "granted"
        )
            return;


        const registration =
            await registerPushServiceWorker();


        const subscription =
            await registration
                .pushManager
                .getSubscription();


        if(subscription){

            await savePushSubscription(
                subscription
            );
        }


    }catch(error){

        console.error(
            "Push check error:",
            error
        );
    }
}


notificationBtn.addEventListener(
    "click",
    enablePushNotifications
);


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth
    .onAuthStateChange(
        async (
            event,
            session
        ) => {

            if(
                event ===
                "SIGNED_IN" &&
                session
            ){

                currentUser =
                    session.user;


                await loadCurrentProfile();

                await enterApp();
            }


            if(
                event ===
                "SIGNED_OUT"
            ){

                currentUser = null;
                currentProfile = null;
                selectedUser = null;
                await endVoiceCall(false);
                if(realtimeControlChannel){
                    await supabaseClient.removeChannel(realtimeControlChannel);
                    realtimeControlChannel = null;
                }
                for(const channel of controlChannels.values()) await supabaseClient.removeChannel(channel);
                controlChannels.clear();

                showAuth();
            }

        }
    );
