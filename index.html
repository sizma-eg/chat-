<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080c">
<meta name="description" content="Chat+ — محادثات خاصة وسريعة">
<title>Chat+ | شات خاص</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07080c;
    --panel:#0d0f15;
    --panel2:#11141c;
    --panel3:#171a24;
    --border:rgba(255,255,255,.08);
    --text:#f4f5f8;
    --muted:#8d93a3;
    --accent:#7c5cff;
    --accent2:#00d4ff;
    --success:#25d58b;
    --danger:#ff5470;
    --shadow:0 20px 60px rgba(0,0,0,.45);
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 15%,rgba(124,92,255,.12),transparent 30%),
        radial-gradient(circle at 85% 85%,rgba(0,212,255,.08),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:Arial,"Segoe UI",sans-serif;
    overflow:hidden;
}

button,input,textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   AUTH
========================= */

.auth-screen{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at 50% 30%,rgba(124,92,255,.16),transparent 35%),
        rgba(3,4,7,.96);
}

.auth-box{
    width:100%;
    max-width:430px;
    background:rgba(13,15,21,.92);
    border:1px solid var(--border);
    border-radius:28px;
    padding:35px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(25px);
}

.logo{
    width:65px;
    height:65px;
    margin:0 auto 20px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:900;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 15px 45px rgba(124,92,255,.3);
}

.auth-box h1{
    text-align:center;
    font-size:30px;
    margin-bottom:8px;
}

.auth-subtitle{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-bottom:28px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:8px;
    color:#c7cad3;
    font-size:13px;
}

.field input{
    width:100%;
    height:50px;
    padding:0 15px;
    border:1px solid var(--border);
    border-radius:14px;
    outline:none;
    color:white;
    background:#090b10;
    transition:.2s;
    direction:rtl;
}

.field input:focus{
    border-color:rgba(124,92,255,.7);
    box-shadow:0 0 0 3px rgba(124,92,255,.1);
}

.auth-btn{
    width:100%;
    height:52px;
    border-radius:15px;
    color:white;
    font-weight:bold;
    background:linear-gradient(135deg,var(--accent),#6042dc);
    box-shadow:0 12px 30px rgba(124,92,255,.2);
    transition:.2s;
    margin-top:5px;
}

.auth-btn:hover{
    transform:translateY(-2px);
}

.switch-auth{
    text-align:center;
    margin-top:20px;
    color:var(--muted);
    font-size:14px;
}

.switch-auth button{
    background:none;
    color:#a999ff;
    font-weight:bold;
    margin-right:5px;
}

.auth-error{
    background:rgba(255,84,112,.1);
    border:1px solid rgba(255,84,112,.2);
    color:#ff91a2;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
    font-size:13px;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100vh;
    display:grid;
    grid-template-columns:330px 1fr;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    background:rgba(13,15,21,.92);
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-width:0;
}

.sidebar-top{
    padding:20px;
    border-bottom:1px solid var(--border);
}

.brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-logo{
    width:38px;
    height:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:15px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.brand span{
    font-weight:900;
    font-size:20px;
}

.my-profile-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--panel3);
    color:white;
    border:1px solid var(--border);
}

.search-box{
    position:relative;
}

.search-box input{
    width:100%;
    height:44px;
    background:#090b10;
    border:1px solid var(--border);
    border-radius:13px;
    outline:none;
    color:white;
    padding:0 40px 0 12px;
}

.search-icon{
    position:absolute;
    right:13px;
    top:12px;
    color:var(--muted);
}

.tabs{
    display:flex;
    gap:5px;
    padding:12px 15px 0;
}

.tab{
    flex:1;
    height:38px;
    border-radius:11px;
    background:transparent;
    color:var(--muted);
    font-size:13px;
}

.tab.active{
    color:white;
    background:var(--panel3);
}

.people-list{
    flex:1;
    overflow:auto;
    padding:8px;
}

.people-list::-webkit-scrollbar,
.messages::-webkit-scrollbar{
    width:5px;
}

.people-list::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb{
    background:#292d38;
    border-radius:10px;
}

.user-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-radius:15px;
    cursor:pointer;
    transition:.18s;
}

.user-item:hover{
    background:var(--panel2);
}

.user-item.active{
    background:linear-gradient(
        90deg,
        rgba(124,92,255,.18),
        rgba(124,92,255,.05)
    );
}

.avatar-wrap{
    position:relative;
    flex-shrink:0;
}

.avatar{
    width:47px;
    height:47px;
    border-radius:15px;
    background:linear-gradient(135deg,#292d3a,#151821);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:16px;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.online-dot{
    position:absolute;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#555b69;
    border:2px solid var(--panel);
    left:-2px;
    bottom:0;
}

.online-dot.online{
    background:var(--success);
}

.user-info{
    min-width:0;
    flex:1;
}

.user-name{
    font-weight:bold;
    font-size:14px;
    margin-bottom:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-username{
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
    font-size:14px;
    line-height:1.8;
}

/* =========================
   CHAT
========================= */

.chat{
    min-width:0;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(circle at 50% 20%,rgba(124,92,255,.045),transparent 35%),
        var(--bg);
}

.chat-header{
    height:76px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 22px;
    gap:13px;
    background:rgba(7,8,12,.72);
    backdrop-filter:blur(18px);
}

.back-btn{
    display:none;
    width:38px;
    height:38px;
    border-radius:12px;
    color:white;
    background:var(--panel3);
}

.chat-user{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
    flex:1;
}

.chat-user-info{
    min-width:0;
}

.chat-name{
    font-weight:900;
    font-size:15px;
}

.chat-status{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.header-action{
    width:40px;
    height:40px;
    border-radius:12px;
    background:var(--panel2);
    border:1px solid var(--border);
    color:white;
}

.messages{
    flex:1;
    overflow:auto;
    padding:25px;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.welcome-chat{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
}

.welcome-chat-inner{
    max-width:400px;
}

.welcome-icon{
    width:80px;
    height:80px;
    margin:0 auto 18px;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(0,212,255,.08));
    border:1px solid var(--border);
}

.welcome-chat h2{
    color:white;
    margin-bottom:8px;
}

.message-row{
    display:flex;
    max-width:78%;
}

.message-row.mine{
    align-self:flex-start;
}

.message-row.theirs{
    align-self:flex-end;
}

.message{
    position:relative;
    min-width:90px;
    padding:10px 13px 8px;
    border-radius:17px;
    border:1px solid var(--border);
}

.mine .message{
    background:linear-gradient(135deg,#674be5,#5038bd);
    border-bottom-left-radius:5px;
}

.theirs .message{
    background:var(--panel2);
    border-bottom-right-radius:5px;
}

.message-text{
    font-size:14px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
}

.message-meta{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:5px;
    margin-top:4px;
    font-size:10px;
    opacity:.65;
}

.message-actions{
    position:absolute;
    top:-38px;
    right:0;
    display:none;
    gap:4px;
    background:var(--panel3);
    border:1px solid var(--border);
    padding:4px;
    border-radius:10px;
    z-index:10;
}

.message:hover .message-actions{
    display:flex;
}

.message-action{
    width:30px;
    height:28px;
    border-radius:7px;
    color:white;
    background:transparent;
    font-size:12px;
}

.message-action:hover{
    background:#242835;
}

.message-action.delete:hover{
    color:var(--danger);
}

.reply-message{
    padding:7px 9px;
    margin-bottom:7px;
    border-right:3px solid rgba(255,255,255,.6);
    background:rgba(255,255,255,.08);
    border-radius:7px;
    font-size:11px;
    opacity:.8;
}

/* =========================
   COMPOSER
========================= */

.composer-wrap{
    padding:12px 20px 18px;
}

.reply-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:9px 12px;
    margin-bottom:8px;
}

.reply-bar.show{
    display:flex;
}

.reply-info{
    min-width:0;
}

.reply-title{
    font-size:11px;
    color:var(--accent2);
    margin-bottom:3px;
}

.reply-text{
    font-size:12px;
    color:var(--muted);
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.cancel-reply{
    width:30px;
    height:30px;
    border-radius:8px;
    color:white;
    background:var(--panel3);
}

.composer{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:18px;
    padding:8px;
}

.composer textarea{
    flex:1;
    resize:none;
    min-height:42px;
    max-height:130px;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:11px 8px;
    line-height:1.5;
}

.composer textarea::placeholder{
    color:#6d7280;
}

.icon-btn{
    width:42px;
    height:42px;
    flex-shrink:0;
    border-radius:12px;
    color:#b7bac5;
    background:transparent;
}

.icon-btn:hover{
    background:var(--panel3);
    color:white;
}

.send-btn{
    background:linear-gradient(135deg,var(--accent),#5c42d0);
    color:white;
}

/* =========================
   PROFILE
========================= */

.profile-panel{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:330px;
    z-index:200;
    background:#0d0f15;
    border-right:1px solid var(--border);
    transform:translateX(-100%);
    transition:.3s;
    box-shadow:var(--shadow);
}

.profile-panel.open{
    transform:translateX(0);
}

.profile-top{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--border);
}

.profile-top h3{
    font-size:16px;
}

.close-profile{
    width:38px;
    height:38px;
    border-radius:11px;
    background:var(--panel3);
    color:white;
}

.profile-content{
    padding:35px 20px;
    text-align:center;
}

.big-avatar{
    width:90px;
    height:90px;
    margin:0 auto 15px;
    border-radius:28px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
}

.profile-content h2{
    font-size:20px;
    margin-bottom:6px;
}

.profile-content p{
    color:var(--muted);
    font-size:13px;
}

.profile-divider{
    height:1px;
    background:var(--border);
    margin:25px 0;
}

.logout-btn{
    width:100%;
    height:46px;
    border-radius:13px;
    background:rgba(255,84,112,.08);
    color:#ff7890;
    border:1px solid rgba(255,84,112,.15);
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:20px;
    bottom:20px;
    z-index:3000;
    background:#151821;
    border:1px solid var(--border);
    color:white;
    padding:12px 16px;
    border-radius:12px;
    box-shadow:var(--shadow);
    transform:translateY(20px);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    font-size:13px;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

.loading{
    opacity:.55;
    pointer-events:none;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .app{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:fixed;
        inset:0;
        z-index:100;
        width:100%;
        transform:translateX(0);
        transition:.25s;
    }

    .chat{
        position:fixed;
        inset:0;
        z-index:150;
        transform:translateX(100%);
        transition:.25s;
    }

    body.chat-open .sidebar{
        transform:translateX(-100%);
    }

    body.chat-open .chat{
        transform:translateX(0);
    }

    .back-btn{
        display:block;
    }

    .messages{
        padding:18px;
    }

    .message-row{
        max-width:88%;
    }
}

@media(max-width:480px){

    .auth-box{
        padding:25px 20px;
        border-radius:22px;
    }

    .auth-box h1{
        font-size:26px;
    }

    .chat-header{
        padding:0 12px;
    }

    .composer-wrap{
        padding:8px 10px 12px;
    }

    .messages{
        padding:14px 10px;
    }

    .message-row{
        max-width:92%;
    }

    .profile-panel{
        width:100%;
    }
}
</style>
</head>

<body>

<section class="auth-screen" id="authScreen">

    <div class="auth-box">

        <div class="logo">C+</div>

        <h1 id="authTitle">أهلًا بيك 👋</h1>

        <p class="auth-subtitle" id="authSubtitle">
            سجّل دخولك وابدأ محادثاتك الخاصة
        </p>

        <div id="authError" class="auth-error hidden"></div>

        <div class="field hidden" id="nameField">
            <label>الاسم</label>
            <input
                id="nameInput"
                type="text"
                placeholder="اكتب اسمك"
                autocomplete="name"
            >
        </div>

        <div class="field">
            <label>اسم المستخدم</label>
            <input
                id="userInput"
                type="text"
                placeholder="مثال: ziad"
                autocomplete="username"
                dir="ltr"
            >
        </div>

        <div class="field">
            <label>كلمة المرور</label>
            <input
                id="passInput"
                type="password"
                placeholder="كلمة المرور"
                autocomplete="current-password"
                dir="ltr"
            >
        </div>

        <button class="auth-btn" id="authBtn">
            تسجيل الدخول
        </button>

        <div class="switch-auth">
            <span id="switchText">لسه معندكش حساب؟</span>
            <button id="switchAuth">إنشاء حساب</button>
        </div>

    </div>

</section>

<div class="app hidden" id="app">

    <aside class="sidebar">

        <div class="sidebar-top">

            <div class="brand-row">

                <div class="brand">
                    <div class="brand-logo">C+</div>
                    <span>Chat+</span>
                </div>

                <button
                    class="my-profile-btn"
                    id="profileBtn"
                    title="حسابي"
                >
                    ☻
                </button>

            </div>

            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input
                    id="search"
                    type="text"
                    placeholder="ابحث عن مستخدم..."
                >

            </div>

        </div>

        <div class="tabs">

            <button
                class="tab active"
                id="peopleTab"
            >
                الأشخاص
            </button>

            <button
                class="tab"
                id="chatsTab"
            >
                المحادثات
            </button>

        </div>

        <div class="people-list" id="peopleList">

            <div class="empty-state">
                جاري تحميل المستخدمين...
            </div>

        </div>

    </aside>

    <main class="chat">

        <header class="chat-header">

            <button
                class="back-btn"
                id="backBtn"
            >
                →
            </button>

            <div
                class="chat-user hidden"
                id="chatUser"
            >

                <div class="avatar-wrap">

                    <div
                        class="avatar"
                        id="chatAvatar"
                    >
                        ?
                    </div>

                    <span
                        class="online-dot"
                        id="chatOnlineDot"
                    ></span>

                </div>

                <div class="chat-user-info">

                    <div
                        class="chat-name"
                        id="chatName"
                    >
                        المستخدم
                    </div>

                    <div
                        class="chat-status"
                        id="chatStatus"
                    >
                        غير متصل
                    </div>

                </div>

            </div>

            <button
                class="header-action hidden"
                id="chatProfileBtn"
                title="الملف الشخصي"
            >
                ☻
            </button>

        </header>

        <section
            class="messages"
            id="messages"
        >

            <div class="welcome-chat">

                <div class="welcome-chat-inner">

                    <div class="welcome-icon">
                        💬
                    </div>

                    <h2>مرحبًا بك في Chat+</h2>

                    <p>
                        اختار شخص من القائمة وابدأ محادثة خاصة.
                    </p>

                </div>

            </div>

        </section>

        <div
            class="composer-wrap hidden"
            id="composerWrap"
        >

            <div
                class="reply-bar"
                id="replyBar"
            >

                <div class="reply-info">

                    <div class="reply-title">
                        رد على الرسالة
                    </div>

                    <div
                        class="reply-text"
                        id="replyText"
                    ></div>

                </div>

                <button
                    class="cancel-reply"
                    id="cancelReply"
                >
                    ×
                </button>

            </div>

            <div class="composer">

                <button
                    class="icon-btn"
                    id="emojiBtn"
                    title="إيموجي"
                >
                    ☺
                </button>

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="اكتب رسالة..."
                ></textarea>

                <button
                    class="icon-btn send-btn"
                    id="sendBtn"
                    title="إرسال"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>

<aside
    class="profile-panel"
    id="profile"
>

    <div class="profile-top">

        <h3>الملف الشخصي</h3>

        <button
            class="close-profile"
            id="closeProfile"
        >
            ×
        </button>

    </div>

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function initials(name){

    const value =
        String(name || "?").trim();

    if(!value){
        return "?";
    }

    return value
        .split(/\s+/)
        .slice(0,2)
        .map(x => x.charAt(0))
        .join("")
        .toUpperCase();
}


function normalizeUsername(username){

    return String(username || "")
        .trim()
        .toLowerCase()
        .replace(/^@/,"");
}


function internalEmail(username){

    return normalizeUsername(username)
        + "@chatplus.app";

/* =========================================================

async function handleAuth(){

    clearAuthError();

    const username =
        normalizeUsername(userInput.value);

    const password =
        passInput.value.trim();

    if(!username){

        showAuthError(
            "اكتب اسم المستخدم."
        );

        return;
    }

    if(username.length < 3){

        showAuthError(
            "اسم المستخدم لازم يكون 3 حروف أو أكثر."
        );

        return;
    }

    if(!/^[a-zA-Z0-9_.-]+$/.test(username)){

        showAuthError(
            "اسم المستخدم يستخدم حروف إنجليزية وأرقام و _ - فقط."
        );

        return;
    }

    if(password.length < 6){

        showAuthError(
            "كلمة المرور لازم تكون 6 أحرف على الأقل."
        );

        return;
    }

    authBtn.classList.add("loading");

    try{

        const email =
            internalEmail(username);

        if(authMode === "signup"){

            const displayName =
                nameInput.value.trim();

            if(!displayName){

                showAuthError(
                    "اكتب اسمك."
                );

                return;
            }

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email,

                    password,

                    options:{
                        data:{
                            username,
                            display_name:displayName
                        }
                    }

                });

            if(error){
                throw error;
            }

            if(!data.session){

                showAuthError(
                    "الحساب اتعمل، لكن تأكيد الإيميل مفعّل في Supabase. اقفل Confirm email من Authentication ثم جرّب تاني."
                );

                return;
            }

            showToast(
                "تم إنشاء الحساب بنجاح 🎉"
            );

        }else{

            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email,

                    password

                });

            if(error){
                throw error;
            }

            if(data.session){

                showToast(
                    "تم تسجيل الدخول 👋"
                );

            }

        }

    }catch(error){

        console.error("AUTH ERROR:",error);

        let message =
            error?.message ||
            "حصل خطأ غير متوقع.";

        const lower =
            message.toLowerCase();

        if(lower.includes("invalid api key")){

            message =
                "مفتاح Supabase غير صالح. افتح Supabase → Project Settings → API وانسخ Publishable Key الحالي.";
        }

        else if(lower.includes("invalid login")){

            message =
                "اسم المستخدم أو كلمة المرور غير صحيحة.";

        }

        else if(lower.includes("already registered")){

            message =
                "اسم المستخدم ده مستخدم بالفعل.";

        }

        showAuthError(message);

    }finally{

        authBtn.classList.remove("loading");

    }
}

/* =========================================================
   PRESENCE
========================================================= */

async function subscribeToPresence(){

    if(presenceChannel){

        try{
            await supabaseClient.removeChannel(
                presenceChannel
            );
        }catch(e){}

    }

    presenceChannel =
        supabaseClient.channel(
            "chatplus-presence",
            {
                config:{
                    presence:{
                        key:currentUser.id
                    }
                }
            }
        );

    presenceChannel
        .on(
            "presence",
            {
                event:"sync"
            },
            () => {

                const state =
                    presenceChannel.presenceState();

                presenceUsers =
                    new Set();

                Object.keys(state).forEach(key => {

                    state[key].forEach(item => {

                        if(item.user_id){

                            presenceUsers.add(
                                item.user_id
                            );

                        }

                    });

                });

                updateOnlineUI();

            }
        )
        .on(
            "presence",
            {
                event:"join"
            },
            ({newPresences}) => {

                newPresences.forEach(item => {

                    if(item.user_id){

                        presenceUsers.add(
                            item.user_id
                        );

                    }

                });

                updateOnlineUI();

            }
        )
        .on(
            "presence",
            {
                event:"leave"
            },
            ({leftPresences}) => {

                leftPresences.forEach(item => {

                    if(item.user_id){

                        presenceUsers.delete(
                            item.user_id
                        );

                    }

                });

                updateOnlineUI();

            }
        )
        .subscribe(
            async status => {

                if(status === "SUBSCRIBED"){

                    await presenceChannel.track({

                        user_id:
                            currentUser.id,

                        username:
                            currentProfile?.username,

                        online:true

                    });

                }

            }
        );
}

/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(){

    if(!currentChatUser){
        return;
    }

    if(!currentMessages.length){

        messages.innerHTML = `
            <div class="empty-state">
                مفيش رسائل لسه.<br>
                ابعت أول رسالة 👋
            </div>
        `;

        return;
    }

    messages.innerHTML =
        currentMessages.map(msg => {

            const mine =
                msg.sender_id === currentUser.id;

            const side =
                mine
                    ? "mine"
                    : "theirs";

            let replyHTML = "";

            if(msg.reply_to){

                const replied =
                    currentMessages.find(
                        m => m.id === msg.reply_to
                    );

                if(replied){

                    replyHTML = `
                        <div class="reply-message">
                            ${escapeHTML(replied.text)}
                        </div>
                    `;

                }

            }

            return `
                <div
                    class="message-row ${side}"
                    data-message-id="${msg.id}"
                >

                    <div class="message">

                        ${
                            mine
                            ?
                            `
                            <div class="message-actions">

                                <button
                                    class="message-action"
                                    data-action="edit"
                                >
                                    تعديل
                                </button>

                                <button
                                    class="message-action delete"
                                    data-action="delete"
                                >
                                    حذف
                                </button>

                            </div>
                            `
                            :
                            ""
                        }

                        <div class="message-actions">

                            <button
                                class="message-action"
                                data-action="reply"
                            >
                                رد
                            </button>

                        </div>

                        ${replyHTML}

                        <div class="message-text">
                            ${escapeHTML(msg.text)}
                        </div>

                        <div class="message-meta">

                            <span>
                                ${formatTime(msg.created_at)}
                            </span>

                            ${
                                mine
                                ?
                                `<span>${
                                    msg.read_at
                                        ? "✓✓"
                                        : "✓"
                                }</span>`
                                :
                                ""
                            }

                        </div>

                    </div>

                </div>
            `;

        }).join("");

    messages
        .querySelectorAll(".message-row")
        .forEach(row => {

            const messageId =
                Number(row.dataset.messageId);

            const msg =
                currentMessages.find(
                    m => m.id === messageId
                );

            row
                .querySelectorAll(".message-action")
                .forEach(button => {

                    button.addEventListener(
                        "click",
                        e => {

                            e.stopPropagation();

                            const action =
                                button.dataset.action;

                            if(action === "reply"){
                                startReply(msg);
                            }

                            if(action === "edit"){
                                editMessage(msg);
                            }

                            if(action === "delete"){
                                deleteMessage(msg);
                            }

                        }
                    );

                });

        });

    messages.scrollTop =
        messages.scrollHeight;
}

            await supabaseClient
                .from("messages")
                .insert({

                        currentChatUser.id,

                    text,

                    reply_to:
                        replyingTo

        if(error){
            throw error;
        }

        messageInput.value = "";

        autoResizeTextarea();

        cancelReplyMode();

        await loadConversation();

        await loadChats();

    }catch(error){

        console.error(error);

        showToast(
            "تعذر إرسال الرسالة."

    }finally{

        sendBtn.classList.remove("loading");

    }
}

/* =========================================================
   EDIT MESSAGE
========================================================= */

async function editMessage(message){

    if(!message){
        return;
    }

    const newText =
        prompt(
            "عدّل الرسالة:",
            message.text
        );

    if(newText === null){
        return;
    }

    const text =
        newText.trim();

    if(!text){

        showToast(
            "الرسالة لا يمكن أن تكون فارغة."
        );

        return;
    }

    const {
        error
    } =
        await supabaseClient
            .from("messages")
            .update({

                text,

                edited_at:
                    new Date().toISOString()

            })
            .eq("id",message.id)
            .eq("sender_id",currentUser.id);

    if(error){

        console.error(error);

        showToast(
            "تعذر تعديل الرسالة."
        );

        return;
    }

    await loadConversation();
}

async function deleteMessage(message){

    if(!message){
        return;
    }

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف الرسالة؟"
        );

    if(!confirmed){
        return;
    }

    const {
        error
    } =
        await supabaseClient
            .from("messages")
            .delete()
            .eq("id",message.id)
            .eq("sender_id",currentUser.id);

    if(error){

        console.error(error);

        showToast(
            "تعذر حذف الرسالة."
        );

        return;
    }

    await loadConversation();

    await loadChats();
}

/* =========================================================
   CHATS
========================================================= */

async function loadChats(){

    if(!currentUser){
        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .select("*")
            .or(
                `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
            )
            .order("created_at",{
                ascending:false
            });

    if(error){

        console.error(error);

        chats = [];

        return;
    }

    const map =
        new Map();

    (data || []).forEach(message => {

        const otherId =
            message.sender_id === currentUser.id
                ? message.receiver_id
                : message.sender_id;

        if(!map.has(otherId)){

            map.set(
                otherId,
                {
                    userId:otherId,
                    latest:message,
                    unread:0
                }
            );

        }

        if(
            message.receiver_id === currentUser.id &&
            !message.read_at
        ){

            map.get(otherId).unread++;

        }

    });

    chats =
        Array.from(map.values());
}


/* =========================================================
   RENDER CHATS
========================================================= */

function renderChats(){

    const query =
        search.value.trim().toLowerCase();

    const list =
        chats
            .map(chat => {

                const user =
                    users.find(
                        u => u.id === chat.userId
                    );

                if(!user){
                    return null;
                }

                return {
                    ...chat,
                    user
                };

            })
            .filter(Boolean)
            .filter(chat => {

                if(!query){
                    return true;
                }

                return (
                    chat.user.display_name
                        .toLowerCase()
                        .includes(query)
                    ||
                    chat.user.username
                        .toLowerCase()
                        .includes(query)
                );

            });

    if(!list.length){

        peopleList.innerHTML = `
            <div class="empty-state">
                مفيش محادثات لسه.<br>
                ابدأ محادثة مع أي شخص.
            </div>
        `;

        return;
    }

    peopleList.innerHTML =
        list.map(chat => {

            const user =
                chat.user;

            const latest =
                chat.latest;

            const active =
                currentChatUser?.id === user.id
                    ? "active"
                    : "";

            const online =
                isOnline(user.id);

            let preview =
                latest.text || "";

            if(
                latest.sender_id === currentUser.id
            ){

                preview =
                    "أنت: " + preview;

            }

            return `
                <div
                    class="user-item ${active}"
                    data-user-id="${user.id}"
                >

                    <div class="avatar-wrap">

                        <div class="avatar">
                            ${escapeHTML(
                                initials(
                                    user.display_name
                                )
                            )}
                        </div>

                        <span
                            class="online-dot ${
                                online ? "online" : ""
                            }"
                        ></span>

                    </div>

                    <div class="user-info">

                        <div class="user-name">
                            ${escapeHTML(
                                user.display_name
                            )}
                        </div>

                        <div class="user-username">
                            ${escapeHTML(preview)}
                        </div>

                    </div>

                    ${
                        chat.unread > 0
                        ?
                        `
                        <div
                            style="
                                min-width:22px;
                                height:22px;
                                border-radius:50%;
                                background:var(--accent);
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                font-size:10px;
                                font-weight:bold;
                            "
                        >
                            ${chat.unread}
                        </div>
                        `
                        :
                        ""
                    }

                </div>
            `;

        }).join("");

    document
        .querySelectorAll(".user-item")
        .forEach(item => {

            item.addEventListener(
                "click",
                () => {

                    const user =
                        users.find(
                            u =>
                                u.id ===
                                item.dataset.userId
                        );

                    if(user){
                        openChat(user);
                    }

                }
            );

        });
}

/* =========================================================
   REALTIME MESSAGES
========================================================= */

function subscribeToMessages(){

    if(messagesChannel){

        try{
            supabaseClient.removeChannel(
                messagesChannel
            );
        }catch(e){}

    }

    messagesChannel =
        supabaseClient
            .channel(
                "chatplus-messages-" +
                currentUser.id
            )

            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"messages"
                },
                async payload => {

                    const message =
                        payload.new;

                    const belongsToCurrentChat =
                        currentChatUser &&
                        (
                            (
                                message.sender_id === currentUser.id &&
                                message.receiver_id === currentChatUser.id
                            )
                            ||
                            (
                                message.sender_id === currentChatUser.id &&
                                message.receiver_id === currentUser.id
                            )
                        );

                    if(belongsToCurrentChat){

                        await loadConversation();

                        if(
                            message.receiver_id === currentUser.id
                        ){

                            await markMessagesRead();

                        }

                    }

                    await loadChats();

                    if(
                        chatsTab.classList.contains("active")
                    ){

                        renderChats();

                    }

                }
            )

            .on(
                "postgres_changes",
                {
                    event:"UPDATE",
                    schema:"public",
                    table:"messages"
                },
                async payload => {

                    const message =
                        payload.new;

                    const belongsToCurrentChat =
                        currentChatUser &&
                        (
                            (
                                message.sender_id === currentUser.id &&
                                message.receiver_id === currentChatUser.id
                            )
                            ||
                            (
                                message.sender_id === currentChatUser.id &&
                                message.receiver_id === currentUser.id
                            )
                        );

                    if(belongsToCurrentChat){

                        await loadConversation();

                    }

                    await loadChats();

                    if(
                        chatsTab.classList.contains("active")
                    ){

                        renderChats();

                    }

                }
            )

            .on(
                "postgres_changes",
                {
                    event:"DELETE",
                    schema:"public",
                    table:"messages"
                },
                async () => {

                    if(currentChatUser){

                        await loadConversation();

                    }

                    await loadChats();

                    if(
                        chatsTab.classList.contains("active")
                    ){

                        renderChats();

                    }

                }
            )

            .subscribe();

}
