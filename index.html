<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#080808">

<meta
    name="description"
    content="Chat+ — محادثات خاصة وسريعة."
>

<title>Chat+ — Private Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070707;
    --panel:#101010;
    --panel2:#151515;
    --panel3:#1b1b1b;

    --border:rgba(255,255,255,.08);

    --text:#fff;
    --muted:#999;

    --bubble:#202020;

    --mine:#fff;
    --mineText:#080808;

    --danger:#ff4d5e;
}

body{
    font-family:"Cairo",sans-serif;
    background:var(--bg);
    color:var(--text);

    min-height:100vh;

    overflow:hidden;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}


/* =========================================================
   AUTH
========================================================= */

.auth-screen{

    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,255,255,.08),
            transparent 35%
        ),
        #070707;
}

.auth-box{

    width:100%;
    max-width:430px;

    background:rgba(17,17,17,.94);

    border:1px solid var(--border);

    border-radius:28px;

    padding:35px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.55);
}

.logo{

    text-align:center;

    font-size:42px;

    font-weight:800;

    letter-spacing:-2px;

    margin-bottom:7px;
}

.logo span{
    color:#999;
}

.auth-subtitle{

    text-align:center;

    color:var(--muted);

    font-size:14px;

    margin-bottom:30px;
}

.auth-form{

    display:flex;

    flex-direction:column;

    gap:13px;
}

.field{
    position:relative;
}

.field input{

    width:100%;

    height:54px;

    padding:0 17px;

    background:#0d0d0d;

    border:1px solid var(--border);

    border-radius:15px;

    color:#fff;

    outline:none;

    transition:.2s;
}

.field input:focus{

    border-color:
        rgba(255,255,255,.35);

    background:#111;
}

.auth-btn{

    height:54px;

    border-radius:15px;

    background:#fff;

    color:#000;

    font-weight:800;

    font-size:15px;

    margin-top:5px;

    transition:.2s;
}

.auth-btn:hover{

    transform:translateY(-1px);

    opacity:.92;
}

.auth-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.switch-auth{

    text-align:center;

    margin-top:20px;

    color:var(--muted);

    font-size:13px;
}

.switch-auth button{

    background:none;

    color:#fff;

    font-weight:700;

    margin-right:5px;
}

.auth-error{

    background:
        rgba(255,77,94,.1);

    border:
        1px solid rgba(255,77,94,.2);

    color:#ff8c97;

    padding:11px 13px;

    border-radius:12px;

    font-size:12px;

    margin-bottom:12px;
}


/* =========================================================
   APP
========================================================= */

.app{

    height:100vh;

    width:100%;

    display:flex;

    background:#080808;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    width:350px;

    min-width:350px;

    height:100%;

    border-left:
        1px solid var(--border);

    background:#0d0d0d;

    display:flex;

    flex-direction:column;
}

.sidebar-top{
    padding:22px 20px 15px;
}

.brand-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;
}

.brand{

    font-size:25px;

    font-weight:800;

    letter-spacing:-1px;
}

.brand span{
    color:#777;
}

.profile-mini{

    width:40px;
    height:40px;

    border-radius:50%;

    background:#202020;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:800;

    border:
        1px solid var(--border);

    cursor:pointer;
}

.search-box{
    position:relative;
}

.search-box input{

    width:100%;

    height:46px;

    background:#171717;

    border:
        1px solid var(--border);

    border-radius:14px;

    color:#fff;

    padding:
        0 43px 0 14px;

    outline:none;
}

.search-icon{

    position:absolute;

    right:14px;

    top:50%;

    transform:translateY(-50%);

    color:#777;
}

.tabs{

    display:flex;

    padding:
        12px 20px 5px;

    gap:7px;
}

.tab{

    flex:1;

    height:40px;

    border-radius:11px;

    background:transparent;

    color:#777;

    font-weight:700;
}

.tab.active{

    background:#1b1b1b;

    color:#fff;
}

.people-list{

    flex:1;

    overflow-y:auto;

    padding:
        8px 10px 20px;
}

.people-list::-webkit-scrollbar,
.messages::-webkit-scrollbar{
    width:4px;
}

.people-list::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb{

    background:#2b2b2b;

    border-radius:20px;
}

.person{

    display:flex;

    align-items:center;

    gap:12px;

    padding:12px;

    border-radius:15px;

    cursor:pointer;

    transition:.15s;
}

.person:hover{
    background:#151515;
}

.person.active{
    background:#1b1b1b;
}

.avatar{

    width:46px;

    height:46px;

    min-width:46px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #292929,
            #111
        );

    border:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:800;

    position:relative;
}

.online-dot{

    position:absolute;

    width:11px;

    height:11px;

    border-radius:50%;

    background:#55e68a;

    border:
        2px solid #0d0d0d;

    bottom:0;

    left:0;
}

.person-info{

    min-width:0;

    flex:1;
}

.person-name{

    font-size:14px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.person-username{

    color:#777;

    font-size:11px;

    direction:ltr;

    text-align:right;
}

.empty{

    text-align:center;

    color:#666;

    font-size:13px;

    padding:40px 20px;
}


/* =========================================================
   CHAT
========================================================= */

.chat{

    flex:1;

    min-width:0;

    display:flex;

    flex-direction:column;

    position:relative;
}

.chat-header{

    height:74px;

    min-height:74px;

    padding:
        0 22px;

    border-bottom:
        1px solid var(--border);

    display:flex;

    align-items:center;

    gap:13px;

    background:
        rgba(10,10,10,.9);
}

.back-btn{

    display:none;

    width:40px;

    height:40px;

    border-radius:12px;

    background:#181818;

    color:#fff;

    font-size:20px;
}

.header-avatar{

    width:42px;

    height:42px;

    min-width:42px;
}

.header-info{

    flex:1;

    min-width:0;
}

.header-name{

    font-size:14px;

    font-weight:800;
}

.header-status{

    font-size:11px;

    color:#777;
}

.header-actions{

    display:flex;

    gap:7px;
}

.icon-btn{

    width:40px;

    height:40px;

    border-radius:12px;

    background:#171717;

    color:#fff;

    border:
        1px solid var(--border);

    font-size:17px;
}


/* =========================================================
   MESSAGES
========================================================= */

.messages{

    flex:1;

    overflow-y:auto;

    padding:
        25px clamp(15px,5vw,80px);

    display:flex;

    flex-direction:column;

    gap:7px;
}

.start-chat{

    margin:auto;

    text-align:center;

    color:#555;
}

.start-chat .big{

    font-size:50px;

    margin-bottom:10px;
}

.message-row{

    display:flex;

    width:100%;
}

.message-row.mine{
    justify-content:flex-start;
}

.message-row.theirs{
    justify-content:flex-end;
}

.message{

    max-width:min(70%,600px);

    position:relative;
}

.bubble{

    padding:
        10px 14px;

    border-radius:17px;

    background:var(--bubble);

    color:#fff;

    font-size:14px;

    line-height:1.7;

    word-break:break-word;

    white-space:pre-wrap;
}

.mine .bubble{

    background:var(--mine);

    color:var(--mineText);

    border-bottom-right-radius:5px;
}

.theirs .bubble{
    border-bottom-left-radius:5px;
}

.message-meta{

    font-size:9px;

    color:#666;

    margin-top:3px;

    padding:0 5px;
}

.mine .message-meta{
    text-align:right;
}

.edited{

    color:#777;

    font-size:9px;

    margin-right:4px;
}

.reply-preview{

    border-right:
        3px solid #888;

    background:
        rgba(255,255,255,.06);

    padding:
        5px 8px;

    border-radius:8px;

    font-size:11px;

    color:#aaa;

    margin-bottom:7px;
}

.mine .reply-preview{

    border-right-color:#777;

    background:
        rgba(0,0,0,.08);

    color:#555;
}

.message-menu{

    position:absolute;

    top:-40px;

    right:0;

    display:none;

    background:#202020;

    border:
        1px solid var(--border);

    border-radius:10px;

    overflow:hidden;

    z-index:5;
}

.message:hover .message-menu{
    display:flex;
}

.message-menu button{

    background:none;

    color:#fff;

    padding:
        7px 9px;

    font-size:11px;
}

.message-menu button:hover{
    background:#2a2a2a;
}


/* =========================================================
   COMPOSER
========================================================= */

.composer{

    padding:
        13px 18px 18px;

    border-top:
        1px solid var(--border);

    background:#0b0b0b;
}

.reply-bar{

    display:flex;

    align-items:center;

    gap:10px;

    padding:
        8px 12px;

    background:#161616;

    border-radius:12px;

    margin-bottom:8px;

    font-size:11px;

    color:#aaa;
}

.reply-bar-text{
    flex:1;
}

.reply-close{

    background:none;

    color:#fff;

    font-size:16px;
}

.composer-inner{

    display:flex;

    align-items:flex-end;

    gap:8px;
}

.textarea-wrap{

    flex:1;

    background:#161616;

    border:
        1px solid var(--border);

    border-radius:17px;

    display:flex;

    align-items:flex-end;

    padding:7px 8px;
}

#messageInput{

    width:100%;

    min-height:42px;

    max-height:130px;

    resize:none;

    background:none;

    border:0;

    outline:0;

    color:#fff;

    padding:
        9px 8px;

    font-size:14px;
}

#messageInput::placeholder{
    color:#666;
}

.emoji-btn,
.send-btn{

    width:43px;

    height:43px;

    min-width:43px;

    border-radius:13px;
}

.emoji-btn{

    background:#1b1b1b;

    color:#fff;

    font-size:19px;
}

.send-btn{

    background:#fff;

    color:#000;

    font-size:18px;

    font-weight:800;
}

.send-btn:disabled{

    opacity:.3;

    cursor:not-allowed;
}


/* =========================================================
   PROFILE
========================================================= */

.profile-panel{

    position:absolute;

    top:0;

    left:0;

    width:340px;

    height:100%;

    background:#111;

    border-right:
        1px solid var(--border);

    z-index:30;

    transform:translateX(-105%);

    transition:.25s ease;

    box-shadow:
        20px 0 80px rgba(0,0,0,.4);
}

.profile-panel.open{
    transform:translateX(0);
}

.profile-head{

    height:74px;

    border-bottom:
        1px solid var(--border);

    display:flex;

    align-items:center;

    gap:12px;

    padding:
        0 18px;
}

.profile-head button{

    background:none;

    color:#fff;

    font-size:20px;
}

.profile-content{

    padding:
        30px 20px;

    text-align:center;
}

.profile-avatar{

    width:90px;

    height:90px;

    margin:auto;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #303030,
            #111
        );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

    font-weight:800;

    border:
        1px solid var(--border);
}

.profile-name{

    font-size:20px;

    font-weight:800;

    margin-top:15px;
}

.profile-username{

    color:#666;

    font-size:12px;

    direction:ltr;
}

.profile-actions{

    margin-top:30px;

    display:flex;

    flex-direction:column;

    gap:9px;
}

.profile-action{

    width:100%;

    min-height:48px;

    border-radius:13px;

    background:#1a1a1a;

    color:#fff;

    text-align:right;

    padding:
        0 15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border:
        1px solid var(--border);
}

.profile-action:hover{
    background:#202020;
}

.profile-action:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.profile-action.danger{
    color:#ff6975;
}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    bottom:25px;

    left:50%;

    transform:
        translate(-50%,20px);

    background:#fff;

    color:#000;

    padding:
        11px 17px;

    border-radius:12px;

    font-size:12px;

    font-weight:700;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:100;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   EMOJI
========================================================= */

.emoji-panel{

    position:absolute;

    bottom:82px;

    right:20px;

    width:270px;

    background:#171717;

    border:
        1px solid var(--border);

    border-radius:17px;

    padding:12px;

    display:none;

    grid-template-columns:
        repeat(7,1fr);

    gap:5px;

    z-index:20;

    box-shadow:
        0 20px 60px rgba(0,0,0,.4);
}

.emoji-panel.open{
    display:grid;
}

.emoji{

    background:none;

    font-size:21px;

    padding:6px;

    border-radius:8px;
}

.emoji:hover{
    background:#252525;
}


/* =========================================================
   LOADING
========================================================= */

.loading{

    display:flex;

    align-items:center;

    justify-content:center;

    height:100%;

    color:#555;
}

.loader{

    width:25px;

    height:25px;

    border:
        2px solid #333;

    border-top-color:#fff;

    border-radius:50%;

    animation:
        spin .7s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .sidebar{

        width:100%;

        min-width:100%;
    }

    .chat{

        position:absolute;

        inset:0;

        background:#080808;

        transform:translateX(100%);

        transition:.25s ease;

        z-index:10;
    }

    .app.chat-open .chat{
        transform:translateX(0);
    }

    .back-btn{
        display:block;
    }

    .message{
        max-width:82%;
    }

    .messages{
        padding:
            18px 12px;
    }

    .profile-panel{
        width:100%;
    }

    .auth-box{
        padding:
            27px 20px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     AUTH SCREEN
========================================================= -->

<section
    id="authScreen"
    class="auth-screen"
>

    <div class="auth-box">

        <div class="logo">
            Chat<span>+</span>
        </div>

        <div class="auth-subtitle">
            محادثات خاصة. بسيطة. سريعة.
        </div>


        <div
            id="authError"
            class="auth-error hidden"
        ></div>


        <!-- =========================
             LOGIN
        ========================== -->

        <form
            id="loginForm"
            class="auth-form"
        >

            <div class="field">

                <input
                    id="loginUsername"
                    type="text"
                    placeholder="اسم المستخدم"
                    autocomplete="username"
                    maxlength="25"
                    required
                >

            </div>


            <div class="field">

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="كلمة المرور"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="auth-btn"
                type="submit"
            >
                تسجيل الدخول
            </button>

        </form>


        <!-- =========================
             SIGNUP
        ========================== -->

        <form
            id="signupForm"
            class="auth-form hidden"
        >

            <div class="field">

                <input
                    id="signupName"
                    type="text"
                    placeholder="اسمك"
                    maxlength="40"
                    required
                >

            </div>


            <div class="field">

                <input
                    id="signupUsername"
                    type="text"
                    placeholder="اسم المستخدم — username"
                    maxlength="25"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="field">

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="البريد الإلكتروني"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="كلمة المرور"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                class="auth-btn"
                type="submit"
            >
                إنشاء الحساب
            </button>

        </form>


        <div class="switch-auth">

            <span id="switchText">
                معندكش حساب؟
            </span>

            <button
                id="switchAuthBtn"
                type="button"
            >
                إنشاء حساب
            </button>

        </div>

    </div>

</section>



<!-- =========================================================
     APP
========================================================= -->

<main
    id="app"
    class="app hidden"
>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">


        <div class="sidebar-top">


            <div class="brand-row">

                <div class="brand">
                    Chat<span>+</span>
                </div>


                <button
                    id="profileMini"
                    class="profile-mini"
                    title="حسابي"
                >
                    U
                </button>

            </div>


            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    id="searchInput"
                    type="text"
                    placeholder="ابحث عن شخص..."
                    autocomplete="off"
                >

            </div>

        </div>


        <div class="tabs">

            <button
                id="peopleTab"
                class="tab active"
                type="button"
            >
                الأشخاص
            </button>


            <button
                id="chatsTab"
                class="tab"
                type="button"
            >
                المحادثات
            </button>

        </div>


        <div
            id="peopleList"
            class="people-list"
        >

            <div class="loading">

                <div class="loader"></div>

            </div>

        </div>

    </aside>



    <!-- =====================================================
         CHAT
    ====================================================== -->

    <section class="chat">


        <header class="chat-header">


            <button
                id="backBtn"
                class="back-btn"
                type="button"
            >
                ‹
            </button>


            <div
                id="headerAvatar"
                class="avatar header-avatar"
            >
                +
            </div>


            <div class="header-info">

                <div
                    id="headerName"
                    class="header-name"
                >
                    Chat+
                </div>


                <div
                    id="headerStatus"
                    class="header-status"
                >
                    اختار شخص عشان تبدأ المحادثة
                </div>

            </div>


            <div class="header-actions">

                <button
                    id="headerProfileBtn"
                    class="icon-btn"
                    type="button"
                    title="الملف الشخصي"
                >
                    ⓘ
                </button>

            </div>

        </header>



        <div
            id="messages"
            class="messages"
        >

            <div class="start-chat">

                <div class="big">
                    💬
                </div>

                <div>
                    اختار شخص من القائمة وابدأ الكلام
                </div>

            </div>

        </div>



        <!-- =================================================
             COMPOSER
        ================================================== -->

        <div class="composer">


            <div
                id="replyBar"
                class="reply-bar hidden"
            >

                <div class="reply-bar-text">

                    <span>
                        رد على:
                    </span>

                    <strong id="replyText"></strong>

                </div>


                <button
                    id="cancelReply"
                    class="reply-close"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div class="composer-inner">


                <button
                    id="emojiBtn"
                    class="emoji-btn"
                    type="button"
                >

function escapeHTML(value){

function formatTime(date){

    return new Date(date)
        .toLocaleTimeString(
            "ar-EG",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}


function formatLastSeen(date){

    if(!date)
        return "غير متصل";

    const d =
        new Date(date);

    const diff =
        Date.now() -
        d.getTime();

    if(diff < 60000)
        return "نشط الآن";

    if(diff < 3600000){

        return `منذ ${
            Math.floor(diff / 60000)
        } دقيقة`;
    }

    return `آخر ظهور ${
        d.toLocaleTimeString(
            "ar-EG",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )
    }`;
}


function normalizeUsername(username){

    return username
        .trim()
        .toLowerCase()
        .replace(/\s+/g,"_")
        .replace(
            /[^a-z0-9_\u0600-\u06ff]/g,
            ""
        );
}

/* =========================================================
   RENDER PEOPLE
========================================================= */

function renderPeople(){

    let list =
        [...allUsers];


    const term =
        searchTerm
            .trim()
            .toLowerCase();


    if(term){

        list =
            list.filter(
                user =>

                    (
                        user.display_name ||
                        ""
                    )
                    .toLowerCase()
                    .includes(term)

                    ||

                    (
                        user.username ||
                        ""
                    )
                    .toLowerCase()
                    .includes(term)
            );
    }


    if(activeTab === "chats"){

        const userIds =
            new Set();


        allMessages.forEach(
            message => {

                if(
                    message.sender_id ===
                    currentUser.id
                ){

                    userIds.add(
                        message.receiver_id
                    );
                }


                if(
                    message.receiver_id ===
                    currentUser.id
                ){

                    userIds.add(
                        message.sender_id
                    );
                }

            }
        );


        list =
            list.filter(
                user =>
                    userIds.has(user.id)
            );
    }


    if(!list.length){

        peopleList.innerHTML =
            `
            <div class="empty">

                ${
                    activeTab === "chats"
                        ? "مفيش محادثات لسه."
                        : "مفيش مستخدمين مطابقين."
                }

            </div>
            `;

        return;
    }


    peopleList.innerHTML =
        list
            .map(user => {

                const active =
                    selectedUser?.id ===
                    user.id
                        ? "active"
                        : "";


                return `

                    <div
                        class="person ${active}"
                        data-user-id="${user.id}"
                    >

                        <div class="avatar">

                            ${
                                escapeHTML(
                                    getInitial(
                                        user.display_name
                                    )
                                )
                            }

                                user.online

                                    ? `<span class="online-dot"></span>`

                                    : ""

                            <div class="person-name">

                                ${
                                    escapeHTML(
                                        user.display_name
                                    )
                                }

                            </div>


                            <div class="person-username">

                                @${escapeHTML(
                                    user.username
                                )}

                            </div>

                        </div>

                    </div>

                `;
            })
            .join("");


    document
        .querySelectorAll(".person")
        .forEach(el => {

            el.addEventListener(
                "click",
                () => {

                    const user =
                        allUsers.find(
                            u =>
                                u.id ===

                    if(user)
                        openChat(user);
                }
            );

        });
}

                    message.reply_to
            );


        if(original){

            replyHTML =
                `
                <div class="reply-preview">

                    ${escapeHTML(
                        original.text.slice(
                            0,
                            100
                        )
                    )}

                </div>
                `;
        }
    }


    let menu =
        `
        <div class="message-menu">

            <button
                data-action="reply"
                data-id="${message.id}"
            >
                رد
            </button>
        `;


    if(mine){

        menu +=
            `
            <button
                data-action="edit"
                data-id="${message.id}"
            >
                تعديل
            </button>


            <button
                data-action="delete"
                data-id="${message.id}"
            >
                حذف
            </button>
            `;
    }


    menu +=
        `
        </div>
        `;


    return `

        <div class="message-row ${rowClass}">

            <div class="message">

                ${menu}


                <div class="bubble">

                    ${replyHTML}

                    ${escapeHTML(
                        message.text
                    )}

                </div>


                <div class="message-meta">

                    ${formatTime(
                        message.created_at
                    )}

                    ${
                        message.edited_at

                            ? `
                                <span class="edited">
                                    تم التعديل
                                </span>
                              `

                            : ""
                    }


                    ${
                        mine

                            ? (
                                message.read_at
                                    ? " ✓✓"
                                    : " ✓"
                            )

                            : ""
                    }

                </div>

            </div>

        </div>

    `;
}

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    if(
        !currentUser ||
        !selectedUser
    )
        return;


    const text =
        messageInput.value.trim();


    if(!text)
        return;


    /* =========================
       EDIT
    ========================== */

    if(editingMessage){

        const {
            error
        } =
            await supabaseClient
                .from("messages")
                .update({

                    text,

                    edited_at:
                        new Date()
                            .toISOString()

                })
                .eq(
                    "id",
                    editingMessage.id
                )
                .eq(
                    "sender_id",
                    currentUser.id
                );


        if(error){

            console.error(error);

            showToast(
                "فشل تعديل الرسالة"
            );

            return;
        }


        editingMessage =
            null;


        messageInput.value =
            "";


        messageInput.placeholder =
            "اكتب رسالة...";


        sendBtn.textContent =
            "➤";


        autoResize();

        return;
    }


    /* =========================
       NEW MESSAGE
    ========================== */

    const payload = {

        sender_id:
            currentUser.id,

        receiver_id:
            selectedUser.id,

        text,

        reply_to:
            replyingTo
                ? replyingTo.id
                : null

    };


    const {
        error
    } =
        await supabaseClient
            .from("messages")
            .insert(payload);


    if(error){

        console.error(error);

        showToast(
            "فشل إرسال الرسالة"
        );

        return;
    }


    messageInput.value =
        "";


    clearReply();


    autoResize();


    scrollMessages();
}

    "click",
    sendMessage

/* =========================================================
   REALTIME
========================================================= */

function setupRealtime(){

    if(messagesChannel){

        supabaseClient.removeChannel(
            messagesChannel
        );
    }


    if(profilesChannel){

        supabaseClient.removeChannel(
            profilesChannel
        );
    }


    messagesChannel =
        supabaseClient
            .channel(
                "chatplus-messages"
            )
            .on(

                "postgres_changes",

                {
                    event:"*",

                    schema:"public",

                    table:"messages"
                },

                async payload => {

                    if(!currentUser)
                        return;


                    const message =
                        payload.new ||
                        payload.old;


                    if(!message)
                        return;


                    const related =
                        message.sender_id ===
                            currentUser.id

                        ||

                        message.receiver_id ===
                            currentUser.id;


                    if(!related)
                        return;


                    if(selectedUser){

                        const conversation =

                            (
                                message.sender_id ===
                                currentUser.id &&

                                message.receiver_id ===
                                selectedUser.id
                            )

                            ||

                            (
                                message.sender_id ===
                                selectedUser.id &&

                                message.receiver_id ===
                                currentUser.id
                            );


                        if(conversation){

                            await loadConversation();


                            if(
                                message.receiver_id ===
                                currentUser.id
                            ){

                                await markMessagesRead();
                            }
                        }
                    }


                    await loadRecentMessages();


                    renderPeople();

                }
            )
            .subscribe();


    profilesChannel =
        supabaseClient
            .channel(
                "chatplus-profiles"
            )
            .on(

                "postgres_changes",

                {
                    event:"*",

                    schema:"public",

                    table:"profiles"
                },

                async payload => {

                    await loadUsers();


                    if(
                        selectedUser &&
                        payload.new?.id ===
                        selectedUser.id
                    ){

                        selectedUser =
                            payload.new;


                        updateHeaderStatus();
                    }

                }
            )
            .subscribe();
}

/* =========================================================
   PUSH HELPERS
========================================================= */

function urlBase64ToUint8Array(
    base64String
){

    const padding =
        "=".repeat(
            (
                4 -
                base64String.length % 4
            ) % 4
        );


    const base64 =
        (
            base64String +
            padding
        )
        .replace(
            /-/g,
            "+"
        )
        .replace(
            /_/g,
            "/"
        );


    const rawData =
        window.atob(
            base64
        );


    return Uint8Array.from(
        [...rawData]
            .map(
                char =>
                    char.charCodeAt(0)
            )
    );
}


/* =========================================================
   REGISTER SERVICE WORKER
========================================================= */

async function registerPushServiceWorker(){

    if(
        !("serviceWorker" in navigator)
    ){

        throw new Error(
            "المتصفح لا يدعم Service Worker."
        );
    }


    return await navigator.serviceWorker
        .register(
            "/chat-/sw.js",
            {
                scope:"/chat-/"
            }
        );
}


/* =========================================================
   NOTIFICATION BUTTON
========================================================= */

async function updateNotificationButton(){

    if(
        !("Notification" in window)
    ){

        notificationStatus.textContent =
            "غير مدعوم";

        return;
    }


    if(
        Notification.permission ===
        "granted"
    ){

        notificationStatus.textContent =
            "مفعّلة";

    }else if(
        Notification.permission ===
        "denied"
    ){

        notificationStatus.textContent =
            "مرفوضة";

    }else{

        notificationStatus.textContent =
            "تفعيل";
    }
}


/* =========================================================
   SAVE PUSH SUBSCRIPTION
========================================================= */

async function savePushSubscription(
    subscription
){

    if(!currentUser)
        return false;


    const json =
        subscription.toJSON();


    const endpoint =
        json.endpoint;


    const p256dh =
        json.keys?.p256dh;


    const auth =
        json.keys?.auth;


    if(
        !endpoint ||
        !p256dh ||
        !auth
    )
        return false;


    const {
        error
    } =
        await supabaseClient
            .from(
                "push_subscriptions"
            )
            .upsert(

                {

                    user_id:
                        currentUser.id,

                    endpoint,

                    p256dh,

                    auth,

                    updated_at:
                        new Date()
                            .toISOString()

                },

                {

                    onConflict:
                        "user_id,endpoint"

                }

            );


    if(error){

        console.error(
            "Push subscription error:",
            error
        );

        return false;
    }


    return true;
}


/* =========================================================
   ENABLE PUSH
========================================================= */

async function enablePushNotifications(){

    try{

        if(
            !("Notification" in window)
        ){

            showToast(
                "المتصفح لا يدعم الإشعارات."
            );

            return;
        }


        const permission =
            await Notification
                .requestPermission();


        if(
            permission !==
            "granted"
        ){

            showToast(
                "لم يتم السماح بالإشعارات."
            );


            await updateNotificationButton();


            return;
        }


        const registration =
            await registerPushServiceWorker();


        let subscription =
            await registration
                .pushManager
                .getSubscription();


        if(!subscription){

            subscription =
                await registration
                    .pushManager
                    .subscribe({

                        userVisibleOnly:
                            true,

                        applicationServerKey:
                            urlBase64ToUint8Array(
                                VAPID_PUBLIC_KEY
                            )

                    });
        }


        const saved =
            await savePushSubscription(
                subscription
            );


        if(saved){

            showToast(
                "تم تفعيل إشعارات الرسائل 🔔"
            );


            notificationStatus.textContent =
                "مفعّلة";

        }else{

            showToast(
                "تم التفعيل لكن تعذر حفظ الاشتراك."
            );
        }


        await updateNotificationButton();


    }catch(error){

        console.error(error);


        showToast(
            error.message ||
            "حصل خطأ أثناء تفعيل الإشعارات."
        );
    }
}


/* =========================================================
   CHECK PUSH
========================================================= */

async function checkPushSubscription(){

    try{

        if(
            !("serviceWorker" in navigator)
        )
            return;


        if(
            !("Notification" in window)
        )
            return;


        await updateNotificationButton();


        if(
            Notification.permission !==
            "granted"
        )
            return;


        const registration =
            await registerPushServiceWorker();


        const subscription =
            await registration
                .pushManager
                .getSubscription();


        if(subscription){

            await savePushSubscription(
                subscription
            );
        }


    }catch(error){

        console.error(
            "Push check error:",
            error
        );
    }
}


notificationBtn.addEventListener(

    enablePushNotifications

/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth
    .onAuthStateChange(
        async (
            event,
            session
        ) => {


            if(
                event ===
                    "SIGNED_IN" &&
                session
            ){

                currentUser =
                    session.user;


                await loadCurrentProfile();


                await enterApp();
            }


            if(
                event ===
                "SIGNED_OUT"
            ){

                currentUser =
                    null;


                currentProfile =
                    null;


                selectedUser =
                    null;


                showAuth();
            }

        }
    );
